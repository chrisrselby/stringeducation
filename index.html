/* Layout: sticky top bar, centered 1120px column, card grids that collapse to one column on phones */
:root{
  --bg:#F4F6F3; --surface:#FFFFFF; --ink:#18231F; --muted:#56635D; --line:#DCE2DD;
  --spruce:#1E4A3C; --spruce-ink:#FFFFFF; --amber:#B86F12; --amber-soft:#FBEFD9;
  --violin:#9A3B2A; --viola:#6B4A8E; --cello:#1F6A8A; --bass:#4F6B22; --all:#56635D;
  --display:"Playfair Display", Georgia, serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101814; --surface:#17221D; --ink:#E7EEE9; --muted:#A3B2AA; --line:#2A3832;
  --spruce:#7CC4A4; --spruce-ink:#0E1A15; --amber:#F0AE4E; --amber-soft:#3A2B12;
  --violin:#E58C78; --viola:#BFA2E3; --cello:#7EC6E4; --bass:#B5D17A; --all:#A3B2AA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101814; --surface:#17221D; --ink:#E7EEE9; --muted:#A3B2AA; --line:#2A3832;
  --spruce:#7CC4A4; --spruce-ink:#0E1A15; --amber:#F0AE4E; --amber-soft:#3A2B12;
  --violin:#E58C78; --viola:#BFA2E3; --cello:#7EC6E4; --bass:#B5D17A; --all:#A3B2AA; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--spruce)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3.25rem);font-weight:700;letter-spacing:-.02em}
h2{font-size:clamp(1.5rem,3vw,2rem);font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
.preview-bar{background:var(--amber-soft);color:var(--ink);font-size:.9rem}
.preview-bar .wrap{padding-block:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.preview-bar b{color:var(--amber)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:700;font-size:1.25rem;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px}
.logo svg{flex:none}
.logo .lockup{height:100px;width:auto}
@media (max-width:560px){.logo .lockup{height:80px}}
nav.main{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.main a{text-decoration:none;color:var(--ink);padding:8px 12px;border-radius:999px;font-weight:700;font-size:.95rem}
nav.main a[aria-current="page"]{background:var(--spruce);color:var(--spruce-ink)}
nav.main a:hover:not([aria-current]){background:var(--bg)}
main{padding-block:32px 64px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;padding-block:24px 40px}
.hero > *{min-width:0}
.hero p.lead{font-size:1.2rem;color:var(--muted);margin-top:14px;max-width:34em}
.hero-seal{width:100%;max-width:340px;height:auto;justify-self:center}
.search{display:flex;gap:8px;margin-top:24px;max-width:560px}
.search input{flex:1;min-width:0;font:inherit;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.search input:focus{border-color:var(--spruce);outline:none}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;background:var(--spruce);color:var(--spruce-ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:transparent;color:var(--spruce);border:2px solid var(--spruce)}
.paths{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.path{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.path:hover{border-color:var(--spruce);transform:translateY(-2px)}
.path .k{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);font-weight:700}
.path p{color:var(--muted);font-size:.95rem}
.path .count{margin-top:auto;font-weight:700;color:var(--spruce);font-size:.95rem}
section{margin-top:48px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.sec-head p{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:.9rem;font-weight:700;padding:7px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1.5px solid currentColor;line-height:1.5}
.t-violin{color:var(--violin)}.t-viola{color:var(--viola)}.t-cello{color:var(--cello)}.t-bass{color:var(--bass)}.t-all{color:var(--all)}
.lvl{color:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .meta{display:flex;gap:6px;flex-wrap:wrap}
.card .type{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card a.go{margin-top:auto;font-weight:700}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:12px}
.unit-head{display:flex;gap:14px;align-items:baseline}
.unit-num{font-family:var(--display);font-weight:700;color:var(--amber);font-size:1.4rem;min-width:2.2ch;font-variant-numeric:tabular-nums}
.vids{list-style:none;padding:0;margin:12px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.vids a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--bg);text-decoration:none;color:var(--ink);font-size:.95rem;line-height:1.35;height:100%}
.vids a:hover{outline:2px solid var(--spruce)}
.play{flex:none;width:30px;height:30px;border-radius:50%;background:var(--spruce);display:grid;place-items:center}
.play::after{content:"";border-left:9px solid var(--spruce-ink);border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
#vplayer{width:min(960px,calc(100vw - 32px));max-width:none;padding:0;border:0;border-radius:14px;background:var(--surface);color:var(--ink)}
#vplayer::backdrop{background:rgba(0,0,0,.7)}
.vp-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px}
.vp-head h3{margin:0;font-size:1.05rem}
.vp-x{border:0;background:none;font-size:1.8rem;line-height:1;cursor:pointer;color:inherit;padding:0 4px}
.vp-frame{position:relative;padding-top:56.25%;background:#000}
.vp-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vp-foot{margin:0;padding:10px 16px;font-size:.9rem}
.layout{display:grid;grid-template-columns:240px 1fr;gap:40px}
.layout > *{min-width:0}
.toc{position:sticky;top:90px;align-self:start;font-size:.95rem}
.toc ol{padding-left:18px;margin:8px 0 0;display:grid;gap:6px}
.article h2{margin-top:36px;margin-bottom:12px}
.article .intro{font-size:1.15rem;color:var(--muted);max-width:40em;margin-top:12px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:12px;max-width:44em}
.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:700;width:34px;height:34px;border-radius:50%;border:2px solid var(--spruce);color:var(--spruce);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.check{list-style:none;padding:0;margin:0;display:grid;gap:8px;max-width:44em}
.check li{padding-left:30px;position:relative}
.check li::before{content:"";position:absolute;left:4px;top:6px;width:14px;height:8px;border-left:3px solid var(--spruce);border-bottom:3px solid var(--spruce);transform:rotate(-45deg)}
.callout{background:var(--amber-soft);border-radius:14px;padding:18px 20px;max-width:44em}
.callout h3{margin-bottom:6px}
.trouble{display:grid;gap:12px;max-width:44em}
.trouble div{border-left:4px solid var(--amber);padding:4px 0 4px 16px}
.tabs{display:flex;gap:8px;margin:24px 0 8px;flex-wrap:wrap}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0 20px}
.filters label{font-size:.85rem;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.filters select{font:inherit;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.empty{color:var(--muted);padding:24px;text-align:center;border:2px dashed var(--line);border-radius:14px}
.results{margin-top:20px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
.foot-brand{display:flex;align-items:center;gap:12px}
footer .wrap{padding-block:24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.muted{color:var(--muted)}
@media (max-width:900px){.paths{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.hero .hero-seal{display:none}.layout{grid-template-columns:1fr}.toc{position:static}}
@media (max-width:560px){.paths,.grid{grid-template-columns:1fr}nav.main{margin-left:0}body{font-size:16px}}
.creator{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.cr-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.cr-controls fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0;display:grid;gap:6px;font-size:.95rem}
.cr-controls legend{font-weight:700;font-size:.85rem;color:var(--muted);padding:0 4px}
.cr-controls label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.cr-controls input[type=checkbox]{accent-color:var(--spruce);width:18px;height:18px;margin-top:3px;flex:none}
.cr-title{grid-column:1/-1;flex-direction:column;gap:4px!important;font-size:.85rem;font-weight:700;color:var(--muted)}
.cr-title input{font:inherit;font-size:1rem;font-weight:400;color:var(--ink);padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
.cr-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
.cr-actions .btn:disabled{opacity:.45;cursor:not-allowed}
.cr-out{overflow-x:auto}
.rub-sheet{background:#fff;color:#1a1a1a;border:1px solid var(--line);border-radius:10px;padding:20px;min-width:640px;font-size:13px;line-height:1.4;outline:none}
.rub-sheet:focus{box-shadow:0 0 0 3px var(--amber)}
.rub-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid #1E4A3C;padding-bottom:6px}
.rub-top h3{font-size:1.3rem;color:#1E4A3C}.rub-top span{font-weight:700;color:#8a5a10}
.rub-lines{display:flex;gap:24px;flex-wrap:wrap;margin:12px 0}
.rub{width:100%;border-collapse:collapse;margin-top:8px}
.rub th,.rub td{border:1px solid #9aa59f;padding:6px 8px;vertical-align:top;text-align:left;font-weight:400}
.rub thead th{background:#E3EEEA;font-size:12px}
.rub tbody th{width:30%}.rub tbody th b{font-size:13.5px}
.rub ul{margin:4px 0 0;padding-left:16px;font-size:11.5px;color:#333}
.rub td{font-size:12px}.rub tr{break-inside:avoid}.rub td.sc{width:56px;text-align:center;white-space:nowrap}
.rub-comm{border:1px solid #9aa59f;height:80px;padding:6px 8px;margin-top:10px}
.rub-foot{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:8px;border-top:1px solid #ccd3cf;font-size:11px;color:#555}
.rub-foot svg{height:46px;width:auto;color:#1E4A3C;flex:none}
#print-root{display:none}@media print{body.print-rubric>*:not(#print-root){display:none!important}body.print-rubric{margin:0}body.print-rubric #print-root{display:block}#print-root .rub-sheet{border:0;padding:0;min-width:0;font-size:11px}#print-root .rub td{font-size:10.5px}#print-root .rub ul{font-size:9.5px;margin-top:2px}#print-root .rub th,#print-root .rub td{padding:3px 6px}#print-root .rub-lines{margin:8px 0}#print-root .rub-comm{height:40px}#print-root .rub-foot{margin-top:8px}#print-root .rub-foot svg{height:30px}#print-root .rub-top h3{font-size:1.1rem}@page{size:portrait;margin:.35in}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const YT=id=>"https://youtu.be/"+id;

  <div class="meta" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:16px">${lvlTag(bookLbl([2,3,4]))}${instTag("violin")}${instTag("viola")}${instTag("cello")}${instTag("bass")}</div></aside>
  <article class="article">
  <h1>Teaching vibrato</h1>
  <p class="intro">Build the motion away from the bow first, then in playing position, then add long bows with no rhythm until both arms can do two different things at once.</p>
  <h2 id="v-uv">Violin and viola</h2>
  ${ul(["Hold the instrument in guitar position under the right arm.","“Salute your instrument” with the left hand, then rest the thumb pad on the side of the neck.","Relax the thumb so the hand can swing under the neck. The first finger should not touch the neck.","Place the 2nd finger on the A string and “polish” it by sliding thumb and finger up and down the neck. The palm should not rotate like a door knob.","Keep polishing while you shrink the distance, until the arm moves but thumb and finger only gently hold the neck. The finger knuckles flex and absorb the motion.","Repeat with the 3rd, then 4th, then 1st finger, which is often the hardest.","Bring the instrument to the shoulder, steady it with the right hand, and repeat steps 2 to 6.","Add the bow: long bows, no rhythm."],"steps")}
  <h2 id="v-uvc">Checkpoints</h2>
  ${ul(["Instrument is well supported (use a shoulder rest if needed).","Thumb and vibrato finger hold the neck lightly, without gripping.","The first finger’s base joint stays off the neck.","Arm and wrist motion is smooth, relaxed and parallel to the string.","Palm keeps facing the player’s eyes and does not rotate.","The vibrato finger absorbs the motion in its last joint."],"check")}
  <h2 id="v-ut">Troubleshooting</h2>
  <div class="trouble"><div><b>Vibrato is stiff or shakes the whole instrument.</b><p>Check for space between the 1st finger and the neck. Rest the scroll against a wall to steady the instrument while learning. Some students find vibrato and shifting much easier with a shoulder rest.</p></div>
  <div><b>Palm rotates like a door knob.</b><p>Put the 2nd finger’s tip on the purfling so the side of the finger touches the side of the fingerboard. With the thumb in the crook of the neck, start the motion and let the finger follow the fingerboard’s edge.</p></div></div>
  <h2 id="v-cb">Cello and bass</h2>
  ${ul(["Put the bow on the stand and set up the instrument in a good playing position.","Look forward, not at the left hand. Shape the hand for a handshake and bring the fingertips to the chest below the collarbone.","Keep the elbow fairly still and pivot the arm and hand on the tip of the 2nd finger in a large, slow, smooth arc.","Shape the hand like a “C”, place the 2nd finger lightly on the D string and the thumb lightly on the neck.","Slide finger and thumb up and down about three half steps, slowly and relaxed.","Keep the arm moving while shrinking the slide to two half steps, then one, then none. The finger pad rolls on the string without slipping.","Repeat with other fingers. For the 4th finger, bring the 3rd finger (and thumb if needed) closer for support.","Add the bow: long bows, no rhythm."],"steps")}
  <h2 id="v-cbc">Checkpoints</h2>
  ${ul(["Playing position is correct and the student is not turning to watch the left hand.","Left elbow is suspended, not resting on the instrument, and stays fairly still.","Wrist is straight and relaxed; hand and arm are in line.","Hand keeps its “C” shape with the thumb resting on the neck.","Motion is a smooth arc, not a rotation.","On the 4th finger, the 3rd finger may rest on the string beside it for support."],"check")}
  <h2 id="v-egg">Extra strategy: egg shakers</h2>
  <div class="callout"><h3>Rice-filled plastic eggs</h3><p>Fill plastic eggs with uncooked rice. Students hold an egg in the left hand as if in playing position and shake it to copy the vibrato motion. Violins and violas can compare wrist vibrato and arm vibrato; cellos and basses practise the lower-arm motion without rotating.</p></div>
  </article></div>`;
}

const catsFor=n=>Object.keys(BANK).filter(k=>BANK[k].books.includes(n));
const RB={};
function rubricHTML(n,st){
  const rows=st.cats.filter(k=>BANK[k]).map(k=>{const c=BANK[k];const crit=c.c.filter(x=>x[0]<=n).map(x=>`<li>${esc(x[1])}</li>`).join("");
    return `<tr><th scope="row"><b>${esc(c.n)}</b>${st.crit?`<ul>${crit}</ul>`:""}</th>${c.d.map(d=>`<td>${esc(d)}</td>`).join("")}<td class="sc"></td></tr>`}).join("");
  const total=st.cats.length*6;
  return `<div class="rub-sheet" contenteditable="true" spellcheck="false">
  <div class="rub-top"><h3>${esc(st.title)}</h3><span>${esc(LVL(n))}</span></div>
  ${st.lines?`<div class="rub-lines"><span>Name ____________________________</span><span>Date ___________</span><span>Piece or exercise ______________________</span></div>`:""}
  <table class="rub"><thead><tr><th scope="col">Category</th>${SCALE.map(s=>`<th scope="col"><b>${s[0]}</b> ${s[1]}</th>`).join("")}<th scope="col">Score</th></tr></thead>
  <tbody>${rows}</tbody><tfoot><tr><td colspan="5" style="text-align:right"><b>Total</b></td><td class="sc">/ ${total}</td></tr></tfoot></table>
  ${st.comm?`<div class="rub-comm"><b>Comments</b></div>`:""}
  <div class="rub-foot">${document.querySelector(".logo .lockup").outerHTML}<span>Rubric by Christopher Selby · StringEducation.org · Free to copy and adapt for your students</span></div></div>`;
}
function creatorHTML(n){
  const groups=[["Technique",TECH[n]],["Musical categories",["intonation","rhythm","tone","bowing","musical","ensemble"].filter(k=>BANK[k].books.includes(n))]];
  if(n===4)groups.push(["Wind players in orchestra",["wtone","wpitch","wrhythm","wartic"]]);
  return `<div class="creator" id="cr-${n}">
  <p class="muted" style="margin-bottom:14px">Tick the categories you want to grade. Every row uses the same 6-to-3 scale and the criteria written for ${esc(SHORT[n])}. It works with any method book. You can click any text in the rubric to change it before you print.</p>
  <div class="cr-controls">
   <label class="cr-title">Rubric title<input type="text" data-k="title"></label>
   ${groups.map(g=>`<fieldset><legend>${g[0]}</legend>${g[1].map(k=>`<label><input type="checkbox" data-cat="${k}"> ${esc(BANK[k].n)}</label>`).join("")}</fieldset>`).join("")}
   <fieldset><legend>Include</legend><label><input type="checkbox" data-k="crit"> Criteria under each category</label><label><input type="checkbox" data-k="lines"> Name and date lines</label><label><input type="checkbox" data-k="comm"> Comments box</label></fieldset>
  </div>
  <div class="cr-actions"><button class="btn" data-act="print">Print rubric</button><button class="btn ghost" data-act="word">Download for Word</button><span class="muted cr-count"></span></div>
  <div class="cr-out"></div></div>`;
}
function wireCreator(n,preset){
  const root=document.getElementById("cr-"+n);if(!root)return;
  const st=RB[n]=RB[n]||{title:SHORT[n]+" Playing Test",cats:[...TECH[n],"intonation","rhythm","tone"],crit:true,lines:true,comm:true};
  if(preset){st.title=preset.t;st.cats=[...preset.cats]}
  const draw=()=>{root.querySelector(".cr-out").innerHTML=st.cats.length?rubricHTML(n,st):`<p class="muted">Tick at least one category to see the rubric.</p>`;
    root.querySelector(".cr-count").textContent=st.cats.length?`${st.cats.length} categories · ${st.cats.length*6} points`:"";
    root.querySelectorAll("[data-act]").forEach(b=>b.disabled=!st.cats.length)};
  const sync=()=>{root.querySelector('[data-k="title"]').value=st.title;
    root.querySelectorAll("[data-cat]").forEach(c=>c.checked=st.cats.includes(c.dataset.cat));
    ["crit","lines","comm"].forEach(k=>root.querySelector(`[data-k="${k}"]`).checked=st[k]);draw()};
  root.querySelector('[data-k="title"]').addEventListener("input",e=>{st.title=e.target.value;draw()});
  root.querySelectorAll("[data-cat]").forEach(c=>c.addEventListener("change",()=>{const order=Object.keys(BANK);
    st.cats=c.checked?[...st.cats,c.dataset.cat].sort((a,b)=>order.indexOf(a)-order.indexOf(b)):st.cats.filter(x=>x!==c.dataset.cat);draw()}));
  ["crit","lines","comm"].forEach(k=>root.querySelector(`[data-k="${k}"]`).addEventListener("change",e=>{st[k]=e.target.checked;draw()}));
  root.querySelector('[data-act="print"]').addEventListener("click",()=>{let pr=document.getElementById("print-root");if(!pr){pr=document.createElement("div");pr.id="print-root";document.body.append(pr)}
    pr.innerHTML="";const c=root.querySelector(".rub-sheet").cloneNode(true);c.removeAttribute("contenteditable");pr.append(c);document.body.classList.add("print-rubric");
    const done=()=>{document.body.classList.remove("print-rubric");removeEventListener("afterprint",done)};addEventListener("afterprint",done);window.print()});
  root.querySelector('[data-act="word"]').addEventListener("click",()=>saveDocx(root.querySelector(".rub-sheet"),st.title));
  sync();
}

// Build a real .docx from the on-screen rubric (keeps any edits the teacher typed). Uses JSZip.
const xe=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wr=(t,o={})=>`<w:r><w:rPr>${o.b?"<w:b/>":""}${o.sz?`<w:sz w:val="${o.sz}"/>`:""}${o.c?`<w:color w:val="${o.c}"/>`:""}</w:rPr><w:t xml:space="preserve">${xe(t)}</w:t></w:r>`;
const wp=(runs,o={})=>`<w:p><w:pPr><w:spacing w:after="${o.after??60}"/>${o.jc?`<w:jc w:val="${o.jc}"/>`:""}</w:pPr>${runs}</w:p>`;
const wc=(paras,w,fill)=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${fill?`<w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>`:""}</w:tcPr>${paras||wp("")}</w:tc>`;
async function saveDocx(sheet,title){
  const W=[3100,1650,1650,1650,1650,800];
  const head=[...sheet.querySelectorAll(".rub thead th")].map((th,i)=>wc(wp(wr(th.textContent.trim(),{b:1,sz:18})),W[i],"E3EEEA")).join("");
  const rows=[...sheet.querySelectorAll(".rub tbody tr")].map(tr=>{const th=tr.querySelector("th");const name=th.querySelector("b")?.textContent.trim()||th.textContent.trim();
    const crit=[...th.querySelectorAll("li")].map(li=>wp(wr("• "+li.textContent.trim(),{sz:16}),{after:20})).join("");
    const tds=[...tr.querySelectorAll("td")].map((td,i)=>wc(wp(wr(td.textContent.trim(),{sz:18})),W[i+1])).join("");
    return `<w:tr><w:trPr><w:cantSplit/></w:trPr>${wc(wp(wr(name,{b:1,sz:20}))+crit,W[0])}${tds}</w:tr>`}).join("");
  const tot=sheet.querySelector(".rub tfoot td.sc")?.textContent.trim()||"";
  const totalRow=`<w:tr><w:tc><w:tcPr><w:tcW w:w="${W.slice(0,5).reduce((a,b)=>a+b)}" w:type="dxa"/><w:gridSpan w:val="5"/></w:tcPr>${wp(wr("Total",{b:1}),{jc:"right"})}</w:tc>${wc(wp(wr(tot)),W[5])}</w:tr>`;
  const bd=`<w:tblBorders>${["top","left","bottom","right","insideH","insideV"].map(k=>`<w:${k} w:val="single" w:sz="4" w:color="9AA59F"/>`).join("")}</w:tblBorders>`;
  const tbl=`<w:tbl><w:tblPr><w:tblW w:w="${W.reduce((a,b)=>a+b)}" w:type="dxa"/>${bd}<w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${W.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid><w:tr><w:trPr><w:tblHeader/></w:trPr>${head}</w:tr>${rows}${totalRow}</w:tbl>`;
  const lvl=sheet.querySelector(".rub-top span")?.textContent.trim()||"";
  const lines=sheet.querySelector(".rub-lines")?wp(wr([...sheet.querySelectorAll(".rub-lines span")].map(x=>x.textContent.trim()).join("     "),{sz:20}),{after:160}):"";
  const comm=sheet.querySelector(".rub-comm")?wp("",{after:0})+`<w:tbl><w:tblPr><w:tblW w:w="${W.reduce((a,b)=>a+b)}" w:type="dxa"/>${bd}</w:tblPr><w:tblGrid><w:gridCol w:w="${W.reduce((a,b)=>a+b)}"/></w:tblGrid><w:tr><w:trPr><w:trHeight w:val="1100"/></w:trPr>${wc(wp(wr("Comments",{b:1,sz:18})),W.reduce((a,b)=>a+b))}</w:tr></w:tbl>`:"";
  const foot=wp(wr("StringEducation.org",{b:1,c:"1E4A3C",sz:18})+wr("  ·  Rubric by Christopher Selby  ·  Free to copy and adapt for your students",{sz:16,c:"555555"}),{after:0});
  const body=wp(wr(sheet.querySelector(".rub-top h3").textContent.trim(),{b:1,sz:32,c:"1E4A3C"})+wr("    "+lvl,{b:1,sz:20,c:"8A5A10"}),{after:120})+lines+tbl+comm+wp("",{after:120})+foot;
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="576" w:right="576" w:bottom="576" w:left="576" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const zip=new JSZip();
  zip.file("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`);
  zip.file("_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file("word/_rels/document.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  zip.file("word/styles.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/><w:sz w:val="20"/></w:rPr></w:rPrDefault></w:docDefaults></w:styles>`);
  zip.file("word/document.xml",doc);
  const data=await zip.generateAsync({type:"uint8array",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
  const filename=((title||"Rubric").replace(/[^\w\- ]+/g,"").trim()||"Rubric")+".docx";
  const dl=window.claude?.use?await window.claude.use("downloads").catch(()=>null):null;
  if(dl){try{await dl.save({filename,data})}catch(e){}return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"}));a.download=filename;document.body.append(a);a.click();a.remove();
}
